name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build and test (Debug, ad-hoc signed)
        run: |
          xcodebuild \
            -project ProfilePicker.xcodeproj \
            -scheme ProfilePicker \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            test

      - name: Build (Release, developer configuration, ad-hoc signed)
        run: |
          xcodebuild \
            -project ProfilePicker.xcodeproj \
            -scheme ProfilePicker \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build

      - name: Build (App Store configuration, ad-hoc signed)
        run: |
          xcodebuild \
            -project ProfilePicker.xcodeproj \
            -scheme ProfilePicker \
            -configuration AppStore \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build

      - name: Check the App Store bundle
        run: |
          APP="build/Build/Products/AppStore/Profile Picker.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - | grep -q '"com.apple.security.app-sandbox" => true'
