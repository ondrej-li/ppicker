name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (leave empty to use CURRENT_PROJECT_VERSION)
        required: false
        type: string
      upload:
        description: Upload the exported package to TestFlight
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -n "$KEY_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight secrets are not configured; skipping the archive and upload."
          fi

  archive:
    name: Archive and upload
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    # Configure these repository secrets before enabling the upload step:
    #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (contents of AuthKey_XXXX.p8)
    #   BUILD_CERTIFICATE_BASE64 (base64 of an Apple Distribution .p12),
    #   P12_PASSWORD, KEYCHAIN_PASSWORD
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Set the build number
        if: env.BUILD_NUMBER != ''
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ProfilePicker/Info.plist

      - name: Import the distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Write the App Store Connect API key
        run: |
          mkdir -p private_keys
          printf '%s' "${{ secrets.ASC_PRIVATE_KEY }}" > "private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        run: |
          xcodebuild \
            -project ProfilePicker.xcodeproj \
            -scheme ProfilePicker \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/ProfilePicker.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Export for the App Store
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/ProfilePicker.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        run: |
          xcrun altool --upload-app \
            --file "build/export/Profile Picker.pkg" \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID"

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: ProfilePicker-pkg
          path: build/export/Profile Picker.pkg
          if-no-files-found: error
